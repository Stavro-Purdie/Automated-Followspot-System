[env:xiao_esp32c6]
platform = espressif32
board = xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit INA219@^1.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DHAS_INA219=1
    -DCONFIG_IDF_TARGET_ESP32C6
    -DPIN_FAN_TACH=7
